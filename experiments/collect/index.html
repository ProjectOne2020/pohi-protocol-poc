      pendingIntro: 'Some submissions did not go through (possibly a connection issue).',
      retryBtn: 'Retry sending',
      orWord: 'or',
      downloadBtn: 'download it and send it to me',
      inspectIntro: 'If you want to check what was sent, you can',
      inspectBtn: 'view the data',
      inspectSuffix: '. You will see only numbers.',
      followIntro:
        'You just helped test whether this idea actually works. If you are curious, the result of ' +
        'the experiment — whichever way it goes — will be published here:',
      followLiRepo:
        '<a href="https://github.com/ProjectOne2020/pohi-protocol-poc" ' +
        'target="_blank" rel="noopener noreferrer">github.com/ProjectOne2020/pohi-protocol-poc</a>',
      followLiLinkedin:
        '<a href="https://www.linkedin.com/in/alejandro-guti%C3%A9rrez-9a0318107/" ' +
        'target="_blank" rel="noopener noreferrer">Alejandro Gutiérrez on LinkedIn</a>',
      followLiEmail:
        '<a href="mailto:alejandro.gutierrezb31@gmail.com">alejandro.gutierrezb31@gmail.com</a>',
      shareMuted:
        'And if you know someone who could spare five minutes, sharing the link helps more than ' +
        'anything else: the more different people take part, the stronger the result.',

      corpusNotes: 'Collected with informed consent. No key identities recorded.',
      downloadPrefix: 'pohi-typing-',

      prompts: [
        'Tell me what you did last weekend.',
        'Describe, in your own words, the last place you traveled to, or somewhere you would like to travel to. Explain what caught your attention about it and what you remember most about that place.',
        'What is your favorite food, and how is it made?',
        'Imagine you had to explain to someone who has never used a computer how to send an email. Write that explanation step by step, with as much detail as you think is needed for it to make sense.',
        'Write about a movie or show you have watched recently.',
        'Think of something you learned over the past year, whether at work or elsewhere, and explain how you learned it and how it has helped you since.'
      ]
    }
  };

  function detectInitialLang() {
    try {
      var saved = localStorage.getItem(LANG_KEY);
      if (saved === 'es' || saved === 'en') return saved;
    } catch (e) {}
    var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
    return nav.indexOf('en') === 0 ? 'en' : 'es';
  }

  var currentLang = detectInitialLang();
  var PROMPTS = STRINGS[currentLang].prompts;

  var deviceClass = null;
  var promptIndex = 0;
  var sent = 0;
  var collected = [];
  var events = [];
  var renderTime = 0;
  var active = new Map();

  var $ = function (id) { return document.getElementById(id); };
  function now() { return performance.timeOrigin + performance.now(); }

  var input = $('input');

  function randomId(prefix) {
    if (crypto.randomUUID) return prefix + crypto.randomUUID();
    return prefix + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  // Token estable por participante: enlaza sus sesiones entre sí sin identificarle.
  function participantToken() {
    var token = null;
    try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
    if (!token) {
      token = randomId('p-');
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    }
    return token;
  }

  // ── Cola persistente: un envío fallido sobrevive a recargar la página ──
  function readQueue() {
    try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; }
  }
  function writeQueue(q) {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
  }
  function enqueue(row) { var q = readQueue(); q.push(row); writeQueue(q); }

  function postRow(row) {
    if (!ENDPOINT) return Promise.reject(new Error('no endpoint'));
    return fetch(ENDPOINT, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(row)
    }).then(function (res) {
      if (!res.ok) return res.text().then(function (t) { throw new Error(res.status + ' ' + t); });
      return true;
    });
  }

  function flushQueue() {
    var q = readQueue();
    if (q.length === 0) return Promise.resolve(0);
    var remaining = [];
    var okCount = 0;
    return q.reduce(function (chain, row) {
      return chain.then(function () {
        return postRow(row).then(function () { okCount++; })
          .catch(function () { remaining.push(row); });
      });
    }, Promise.resolve()).then(function () {
      writeQueue(remaining);
      return okCount;
    });
  }

  function setStatus(text, cls) {
    var el = $('status');
    el.textContent = text;
    el.className = cls || '';
  }

  // ─────────────────────────────────────────────────────────────────────
  // RENDERIZADO DE IDIOMA / LANGUAGE RENDERING
  // ─────────────────────────────────────────────────────────────────────
  function applyLanguage(lang) {
    var t = STRINGS[lang];
    currentLang = lang;
    PROMPTS = t.prompts;

    document.documentElement.lang = lang;
    document.title = t.pageTitle;

    $('langEs').classList.toggle('active', lang === 'es');
    $('langEn').classList.toggle('active', lang === 'en');

    $('mainTitle').textContent = t.mainTitle;
    $('mainSub').textContent = t.mainSub;

    $('aboutH2').textContent = t.aboutH2;
    $('aboutP1').innerHTML = t.aboutP1;
    $('aboutP2').innerHTML = t.aboutP2;
    $('aboutP3').innerHTML = t.aboutP3;

    $('whyH2').textContent = t.whyH2;
    $('whyP1').innerHTML = t.whyP1;
    $('whyP2').innerHTML = t.whyP2;
    $('whyP3').innerHTML = t.whyP3;
    $('whyMuted').innerHTML = t.whyMuted;

    $('whoH2').textContent = t.whoH2;
    $('whoP1').innerHTML = t.whoP1;
    $('whoLiEmail').innerHTML = t.whoLiEmail;
    $('whoLiLinkedin').innerHTML = t.whoLiLinkedin;
    $('whoLiRepo').innerHTML = t.whoLiRepo;
    $('whoMuted').innerHTML = t.whoMuted;

    $('whatH2').textContent = t.whatH2;
    $('whatP1').innerHTML = t.whatP1;
    $('whatLiYes1').innerHTML = t.whatLiYes1;
    $('whatLiYes2').innerHTML = t.whatLiYes2;
    $('whatLiYes3').innerHTML = t.whatLiYes3;
    $('whatLiNo1').innerHTML = t.whatLiNo1;
    $('whatLiNo2').innerHTML = t.whatLiNo2;
    $('whatP2').innerHTML = t.whatP2;

    if (ENDPOINT) {
      $('sendingHeading').textContent = t.sendingHeading;
      $('sendingText').innerHTML = t.sendingText;
    } else {
      $('sendingHeading').textContent = t.sendingHeadingOffline;
      $('sendingText').innerHTML = t.sendingTextOffline;
    }
    $('sendingMuted').innerHTML = t.sendingMuted;

    $('participationH2').textContent = t.participationH2;
    $('participationP').textContent = t.participationP;

    $('deviceH2').textContent = t.deviceH2;
    $('deviceDesktopLabel').textContent = t.deviceDesktopLabel;
    $('deviceLaptopLabel').textContent = t.deviceLaptopLabel;
    $('deviceIosLabel').textContent = t.deviceIosLabel;
    $('deviceAndroidLabel').textContent = t.deviceAndroidLabel;
    $('deviceOtherLabel').textContent = t.deviceOtherLabel;

    $('startBtn').textContent = t.startBtn;

    input.setAttribute('placeholder', t.placeholder);
    $('nextBtn').textContent = t.nextBtn;

    $('doneH2').textContent = t.doneH2;
    $('pendingIntro').textContent = t.pendingIntro;
    $('retryBtn').textContent = t.retryBtn;
    $('orWord').textContent = t.orWord;
    $('downloadBtn').textContent = t.downloadBtn;
    $('inspectIntro').textContent = t.inspectIntro;
    $('inspectBtn').textContent = t.inspectBtn;
    $('inspectSuffix').textContent = t.inspectSuffix;
    $('followIntro').textContent = t.followIntro;
    $('followLiRepo').innerHTML = t.followLiRepo;
    $('followLiLinkedin').innerHTML = t.followLiLinkedin;
    $('followLiEmail').innerHTML = t.followLiEmail;
    $('shareMuted').textContent = t.shareMuted;
  }

  function setLang(lang) {
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLanguage(lang);
  }

  $('langEs').addEventListener('click', function () { setLang('es'); });
  $('langEn').addEventListener('click', function () { setLang('en'); });

  // ── Consentimiento ──
  Array.prototype.forEach.call(document.getElementsByName('device'), function (radio) {
    radio.addEventListener('change', function () {
      deviceClass = radio.value;
      $('startBtn').disabled = false;
    });
  });

  $('startBtn').addEventListener('click', function () {
    $('langToggle').classList.add('hidden');
    $('consent').classList.add('hidden');
    $('task').classList.remove('hidden');
    flushQueue();
    showPrompt();
  });

  // ── Captura ──
  input.addEventListener('keydown', function (ev) {
    if (ev.isComposing || ev.repeat) return;
    var key = ev.key;
    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].indexOf(key) !== -1) return;
    if (!active.has(key)) active.set(key, now());
  });

  input.addEventListener('keyup', function (ev) {
    var key = ev.key;
    if (!active.has(key)) return;
    var pressTime = active.get(key);
    active.delete(key);
    events.push({ isBackspace: key === 'Backspace', pressTime: pressTime, releaseTime: now() });
  });

  input.addEventListener('touchstart', function () {
    if (!active.has('__touch')) active.set('__touch', now());
  }, { passive: true });

  input.addEventListener('touchend', function () {
    if (!active.has('__touch')) return;
    var pressTime = active.get('__touch');
    active.delete('__touch');
    events.push({ isBackspace: false, pressTime: pressTime, releaseTime: now() });
  }, { passive: true });

  input.addEventListener('input', function () {
    // Solo exigimos >=1 evento para no violar la restricción de la base de datos
    // (event_count debe ser >=1). El filtro real de calidad (>=11 eventos, el mínimo
    // de la Ecuación 3.2) ocurre después, al exportar el corpus — no aquí. Exigir más
    // aquí bloqueaba a personas que usan predicción de texto, autocompletado, "swipe
    // typing" o dictado por voz: esos métodos cambian el texto sin disparar keydown/keyup.
    var t = STRINGS[currentLang];
    var longEnough = input.value.length >= MIN_CHARS;
    var hasEvents = events.length >= 1;
    $('nextBtn').disabled = !(longEnough && hasEvents);

    if (!longEnough) {
      $('hint').textContent = t.hintMin(MIN_CHARS);
    } else if (!hasEvents) {
      $('hint').textContent = t.hintNoEvents;
    } else {
      $('hint').textContent = '';
    }
  });

  // ── Flujo ──
  function showPrompt() {
    var t = STRINGS[currentLang];
    events = [];
    active.clear();
    input.value = '';
    $('nextBtn').disabled = true;
    $('promptText').textContent = PROMPTS[promptIndex];
    $('progress').textContent = t.progress(promptIndex + 1, PROMPTS.length);
    $('hint').textContent = t.hintMin(MIN_CHARS);

    // t_render de la Ec. 3.3: instante en que el texto queda pintado en pantalla.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        renderTime = now();
        input.focus();
      });
    });
  }

  $('nextBtn').addEventListener('click', function () {
    var t = STRINGS[currentLang];
    $('nextBtn').disabled = true;
    events.sort(function (a, b) { return a.pressTime - b.pressTime; });

    var row = {
      schema_version: 1,
      study_batch: STUDY_BATCH,
      session_id: randomId('s-'),
      participant_token: participantToken(),
      device: deviceClass,
      context_length: PROMPTS[promptIndex].length,
      render_time: renderTime,
      events: events.slice(),
      event_count: events.length,
      client_collected_at: new Date().toISOString()
    };

    collected.push(row);

    var advance = function () {
      promptIndex += 1;
      if (promptIndex < PROMPTS.length) showPrompt(); else finish();
    };

    if (!ENDPOINT) { advance(); return; }

    setStatus(t.sendingStatus);
    postRow(row)
      .then(function () { sent++; setStatus(t.sentStatus, 'ok'); })
      .catch(function () {
        enqueue(row);
        setStatus(t.offlineStatus, 'warn');
      })
      .then(advance);
  });

  function finish() {
    var t = STRINGS[currentLang];
    $('task').classList.add('hidden');
    $('done').classList.remove('hidden');

    var totalEvents = collected.reduce(function (a, s) { return a + s.event_count; }, 0);
    var pending = readQueue().length;

    if (!ENDPOINT) {
      $('summary').textContent = t.summaryOffline(collected.length, totalEvents);
      $('pendingBox').classList.remove('hidden');
      return;
    }

    $('summary').textContent = t.summaryOnline(sent, collected.length, totalEvents);

    if (pending > 0) $('pendingBox').classList.remove('hidden');
  }

  $('retryBtn').addEventListener('click', function () {
    var t = STRINGS[currentLang];
    $('retryBtn').disabled = true;
    flushQueue().then(function (ok) {
      sent += ok;
      var pending = readQueue().length;
      $('summary').textContent = t.summaryAfterRetry(sent, collected.length);
      if (pending === 0) $('pendingBox').classList.add('hidden');
      $('retryBtn').disabled = false;
    });
  });

  $('inspectBtn').addEventListener('click', function () {
    var box = $('inspect');
    box.classList.toggle('hidden');
    box.textContent = JSON.stringify(collected, null, 1);
  });

  $('downloadBtn').addEventListener('click', function () {
    var t = STRINGS[currentLang];
    var corpus = {
      schemaVersion: 1,
      provenance: 'human',
      source: 'collection-page',
      notes: t.corpusNotes,
      createdAt: new Date().toISOString(),
      sessions: collected.map(function (r) {
        return {
          sessionId: r.session_id,
          collectedAt: r.client_collected_at,
          participantId: r.participant_token,
          device: r.device,
          contextLength: r.context_length,
          renderTime: r.render_time,
          events: r.events
        };
      })
    };
    var blob = new Blob([JSON.stringify(corpus, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = t.downloadPrefix + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  // Reintenta lo pendiente en cuanto vuelva la conexión.
  window.addEventListener('online', flushQueue);

  // ── Render inicial ──
  applyLanguage(currentLang);
})();
</script>
